<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Salutation Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            font-size: clamp(1.4rem, 5vw, 2.5rem);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .video-container {
            position: relative;
            background: black;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        #video { display: none; }
        #canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
        }
        .status-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: clamp(0.75rem, 3vw, 1.1rem);
            text-align: center;
            z-index: 10;
        }
        .status-active   { background: #10b981; color: white; }
        .status-waiting  { background: #3b82f6; color: white; }
        .status-intruder { background: #ef4444; color: white; }
        .fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 10;
        }
        .debug-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #00ff00;
            padding: 8px;
            border-radius: 5px;
            font-size: clamp(0.55rem, 2vw, 0.8rem);
            font-family: monospace;
            z-index: 10;
            max-width: 55vw;
        }
        .hold-indicator {
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(255,200,0,0.9);
            color: black;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 10;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: clamp(0.85rem, 3vw, 1rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-reset  { background: #3b82f6; color: white; }
        .btn-end    { background: #f97316; color: white; }
        .btn-relock { background: #8b5cf6; color: white; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .stat-label { color: #6b7280; font-size: 0.9rem; margin-bottom: 8px; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: #1f2937; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-fill { height: 100%; background: #10b981; transition: width 0.3s; }
        .loading { text-align: center; color: white; padding: 50px; font-size: 1.2rem; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        .hidden { display: none; }
        @media (max-width: 600px) {
            .video-container { border-radius: 12px; margin-bottom: 12px; }
            .stats { gap: 10px; }
            .stat-card { padding: 15px; border-radius: 10px; }
            .controls { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧘 Sun Salutation Counter</h1>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading AI models...</p>
        </div>

        <div id="app" class="hidden">
            <div class="video-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <div id="statusBar" class="status-bar"></div>
                <div class="fps-counter">FPS: <span id="fps">0</span></div>
                <div id="holdIndicator" class="hold-indicator hidden"></div>
                <div id="debugInfo" class="debug-info"></div>
            </div>

            <div id="controls" class="controls"></div>
            <div id="stats" class="stats hidden"></div>
        </div>
    </div>

    <script>
        const STAGES = ["Mountain","Upward Salute","Forward Fold","Lunge Left","Plank","Low Plank","Cobra","Downward Dog","Lunge Right","Forward Fold","Upward Salute","Mountain"];
        const CONFIG = {
            historySize: 5,
            poseLostThreshold: 30,
            stageCooldownMs: 100,  // 0.1 seconds
            lockRadius: 400
        };

        let detector, video, canvas, ctx;
        let sessionActive=false, stageIndex=0, counter=0, cooldownUntil=0;
        let landmarkHistory=[], framesWithoutPose=0, lastTime=Date.now(), fps=0;
        let debugText = "";

        // Locked person anchor: set once when session starts
        let lockedCenter = null;

        async function init(){
            try{
                detector = await poseDetection.createDetector(
                    poseDetection.SupportedModels.MoveNet,
                    {modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING}
                );
                video  = document.getElementById('video');
                canvas = document.getElementById('canvas');
                ctx    = canvas.getContext('2d', {willReadFrequently: true});

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {width:1280, height:720, facingMode:'user'}
                });
                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width  = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                updateUI();
                detectPose();
            } catch(err){
                document.getElementById('loading').innerHTML =
                    `<p style="color:#ef4444;">Error: ${err.message}</p><p>Please allow camera access and refresh.</p>`;
            }
        }

        // Returns the average x/y of all high-confidence keypoints
        function getBodyCenter(keypoints){
            const visible = keypoints.filter(kp => kp.score > 0.3);
            if(visible.length === 0) return null;
            const x = visible.reduce((s, kp) => s + kp.x, 0) / visible.length;
            const y = visible.reduce((s, kp) => s + kp.y, 0) / visible.length;
            return {x, y};
        }

        // Returns true if the detected pose belongs to the locked person
        function isLockedPerson(keypoints){
            if(!lockedCenter) return true; // not locked yet, always pass
            const center = getBodyCenter(keypoints);
            if(!center) return false;
            const dist = Math.hypot(center.x - lockedCenter.x, center.y - lockedCenter.y);
            return dist <= CONFIG.lockRadius;
        }

        async function detectPose(){
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();
            const poses = await detector.estimatePoses(video);

            if(poses.length > 0){
                const pose = poses[0];

                if(sessionActive && !isLockedPerson(pose.keypoints)){
                    // Wrong person in frame — freeze everything
                    framesWithoutPose = 0;
                    drawSkeleton(pose.keypoints); // still draw so they can see
                    updateStatus('WRONG PERSON — MOVE BACK TO YOUR SPOT', 'intruder');
                    debugText  = `⚠ Person lock broken!\n`;
                    const c = getBodyCenter(pose.keypoints);
                    if(c){
                        const dist = Math.hypot(c.x - lockedCenter.x, c.y - lockedCenter.y);
                        debugText += `Current center: (${c.x.toFixed(0)}, ${c.y.toFixed(0)})\n`;
                        debugText += `Locked center:  (${lockedCenter.x.toFixed(0)}, ${lockedCenter.y.toFixed(0)})\n`;
                        debugText += `Drift: ${dist.toFixed(0)}px (max ${CONFIG.lockRadius}px)`;
                    }
                } else {
                    framesWithoutPose = 0;
                    landmarkHistory.push(pose.keypoints);
                    if(landmarkHistory.length > CONFIG.historySize) landmarkHistory.shift();

                    const smoothed = smoothLandmarks(landmarkHistory);
                    drawSkeleton(smoothed);

                    if(!sessionActive) checkMountainStart(smoothed);
                    else               checkStage(smoothed);
                }
            } else {
                framesWithoutPose++;
                if(framesWithoutPose > CONFIG.poseLostThreshold && sessionActive) endSession();
            }

            const now = Date.now();
            fps = Math.round(1000 / (now - lastTime));
            lastTime = now;
            document.getElementById('fps').textContent = fps;
            document.getElementById('debugInfo').textContent = debugText;
            requestAnimationFrame(detectPose);
        }

        function smoothLandmarks(history){
            const smoothed = [];
            for(let i = 0; i < 17; i++){
                let x=0, y=0, score=0;
                history.forEach(f => { x+=f[i].x; y+=f[i].y; score+=f[i].score||0; });
                smoothed.push({x:x/history.length, y:y/history.length, score:score/history.length});
            }
            return smoothed;
        }

        function drawSkeleton(kp){
            // Mirror X coords to match flipped video
            const mx = p => canvas.width - p.x;
            const conn = [[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
            ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 3;
            conn.forEach(([s,e]) => {
                if(kp[s].score>0.3 && kp[e].score>0.3){
                    ctx.beginPath(); ctx.moveTo(mx(kp[s]),kp[s].y); ctx.lineTo(mx(kp[e]),kp[e].y); ctx.stroke();
                }
            });
            kp.forEach(p => {
                if(p.score>0.3){
                    ctx.fillStyle='#FF0000'; ctx.beginPath(); ctx.arc(mx(p),p.y,5,0,2*Math.PI); ctx.fill();
                }
            });
        }

        function checkMountainStart(keypoints){
            const side = chooseSide(keypoints);
            const [sh, hip, wr, ank] = side==='left'
                ? [keypoints[5],keypoints[11],keypoints[9], keypoints[15]]
                : [keypoints[6],keypoints[12],keypoints[10],keypoints[16]];

            const detected = detectMountain(sh, hip, wr, ank);
            debugText  = `Waiting for Mountain Pose\n`;
            debugText += `Upright: ${Math.abs(sh.y-hip.y).toFixed(0)} < 180 ? ${Math.abs(sh.y-hip.y)<180}\n`;
            debugText += `Wrist in zone: ${wr.y.toFixed(0)} between ${sh.y.toFixed(0)} and ${hip.y.toFixed(0)} ? ${wr.y > sh.y - 40 && wr.y < hip.y + 40}\n`;
            debugText += `Standing: ${(ank.y-hip.y).toFixed(0)} > -30 ? ${ank.y>hip.y-30}\n`;
            debugText += `Mountain: ${detected}`;

            if(detected){
                // Lock onto this person's position
                lockedCenter = getBodyCenter(keypoints);
                sessionActive = true;
                cooldownUntil = performance.now() + CONFIG.stageCooldownMs;
                updateStatus('SESSION ACTIVE', 'active');
                updateUI();
            } else {
                updateStatus('STAND IN MOUNTAIN POSE TO START', 'waiting');
            }
        }

        function chooseSide(kp){
            const l = (kp[5].score||0)+(kp[11].score||0)+(kp[13].score||0);
            const r = (kp[6].score||0)+(kp[12].score||0)+(kp[14].score||0);
            return l > r ? 'left' : 'right';
        }

        function angle(a,b,c){
            let deg = Math.abs(Math.atan2(c.y-b.y,c.x-b.x) - Math.atan2(a.y-b.y,a.x-b.x)) * 180/Math.PI;
            return deg > 180 ? 360-deg : deg;
        }

        function detectMountain(sh, hip, wr, ank){
            if(!sh||!hip||!wr||!ank) return false;
            if(sh.score<0.3||hip.score<0.3||wr.score<0.3||ank.score<0.3) return false;
            const upright     = Math.abs(sh.y-hip.y)<180;
            const standing    = ank.y>hip.y-30;
            const wristInZone = wr.y > sh.y - 40 && wr.y < hip.y + 40;
            return upright && standing && wristInZone;
        }
        function detectUpwardSalute(sh, wr){
            if(!sh||!wr||sh.score<0.3||wr.score<0.3) return false;
            return wr.y < sh.y;
        }
        function detectForwardFold(sh, hip, wr, kn, ank, oAnk){
            if(!sh||!hip||!wr||!kn||!ank||!oAnk) return false;
            if(sh.score<0.3||hip.score<0.3||wr.score<0.3||kn.score<0.3) return false;
            if(ank.score<0.3||oAnk.score<0.3) return false;
            // Angle between torso (hip->shoulder) and upper leg (hip->knee)
            const torsoVec  = {x: sh.x - hip.x,  y: sh.y - hip.y};
            const legVec    = {x: kn.x - hip.x,  y: kn.y - hip.y};
            const dot       = torsoVec.x*legVec.x + torsoVec.y*legVec.y;
            const magTorso  = Math.hypot(torsoVec.x, torsoVec.y);
            const magLeg    = Math.hypot(legVec.x,   legVec.y);
            const foldAngle = Math.acos(Math.max(-1, Math.min(1, dot / (magTorso * magLeg)))) * 180 / Math.PI;
            // Both ankles close to wrist X (hands reaching down to feet)
            const ankleNearWrist = Math.abs(ank.x - wr.x) < 80 && Math.abs(oAnk.x - wr.x) < 80;
            return foldAngle < 100 && ankleNearWrist;
        }
        function detectLunge(kneeAng, hip, kn, ank, sh, oAnk){
            if(!hip||!kn||!ank||!sh||!oAnk) return false;
            if(hip.score<0.3||kn.score<0.3||ank.score<0.3||sh.score<0.3||oAnk.score<0.3) return false;
            // One ankle significantly further back than the other (staggered feet)
            const feetStaggered = Math.abs(ank.x - oAnk.x) > 80;
            return Math.abs(sh.y-hip.y)<200 && kneeAng>100 && feetStaggered;
        }
        function detectPlank(sh, hip, kn, ank, oppKn, oppAnk, knAng, oppAng){
            if(!sh||!hip||!kn||!ank||!oppKn||!oppAnk) return false;
            if(sh.score<0.3||hip.score<0.3||kn.score<0.3||ank.score<0.3) return false;
            if(oppKn.score<0.3||oppAnk.score<0.3) return false;
            return Math.abs(sh.y-hip.y)<100 && Math.abs(hip.y-kn.y)<100
                && ank.y>kn.y-20 && oppAnk.y>oppKn.y-20
                && knAng>140 && oppAng>140;
        }
        function detectLowPlank(sh, hip, kn, wr){
            if(!sh||!hip||!kn||!wr) return false;
            if(sh.score<0.3||hip.score<0.3||kn.score<0.3||wr.score<0.3) return false;
            const waistAtWrist = Math.abs(hip.y - wr.y) < 60;
            const kneesAtWrist = Math.abs(kn.y  - wr.y) < 80;
            return waistAtWrist && kneesAtWrist;
        }
        function detectCobra(sh, hip, kn, wr){
            if(!sh||!hip||!kn||!wr) return false;
            if(sh.score<0.3||hip.score<0.3||kn.score<0.3||wr.score<0.3) return false;
            return sh.y<hip.y-40 && hip.y>kn.y-100 && wr.y>sh.y-20;
        }
        function detectDownwardDog(sh, hip, kn, ank, wr){
            if(!sh||!hip||!kn||!ank||!wr) return false;
            if(sh.score<0.3||hip.score<0.3||kn.score<0.3||ank.score<0.3||wr.score<0.3) return false;
            return hip.y<sh.y-20 && wr.y>hip.y && ank.y>hip.y;
        }

        function checkPoseByName(name, keypoints, knAng, oppAng, sh, el, hip, kn, ank, wr, oHip, oKn, oAnk){
            switch(name){
                case "Mountain":       return detectMountain(sh, hip, wr, ank);
                case "Upward Salute":  return detectUpwardSalute(sh, wr);
                case "Forward Fold":   return detectForwardFold(sh, hip, wr, kn, ank, oAnk);
                case "Lunge Left":
                case "Lunge Right":    return detectLunge(knAng, hip, kn, ank, sh, oAnk);
                case "Plank":          return detectPlank(sh, hip, kn, ank, oKn, oAnk, knAng, oppAng);
                case "Low Plank":      return detectLowPlank(sh, hip, kn, wr);
                case "Cobra":          return detectCobra(sh, hip, kn, wr);
                case "Downward Dog":   return detectDownwardDog(sh, hip, kn, ank, wr);
                default:               return false;
            }
        }

        function checkStage(keypoints){
            if(performance.now() < cooldownUntil){
                debugText  = `Stage: ${STAGES[stageIndex]} (${stageIndex+1}/${STAGES.length})\n`;
                debugText += `Cooldown: ${(cooldownUntil - performance.now()).toFixed(0)}ms remaining\n`;
                debugText += `(Move into next pose)`;
                document.getElementById('holdIndicator').classList.add('hidden');
                return;
            }

            const side = chooseSide(keypoints);
            const idx = side==='left'
                ? {sh:5, el:7, hip:11, kn:13, ank:15, wr:9,  oHip:12, oKn:14, oAnk:16}
                : {sh:6, el:8, hip:12, kn:14, ank:16, wr:10, oHip:11, oKn:13, oAnk:15};

            const sh   = keypoints[idx.sh];
            const el   = keypoints[idx.el];
            const hip  = keypoints[idx.hip];
            const kn   = keypoints[idx.kn];
            const ank  = keypoints[idx.ank];
            const wr   = keypoints[idx.wr];
            const oHip = keypoints[idx.oHip];
            const oKn  = keypoints[idx.oKn];
            const oAnk = keypoints[idx.oAnk];

            const stage   = STAGES[stageIndex];
            const knAng   = angle(hip, kn,  ank);
            const oppAng  = angle(oHip, oKn, oAnk);

            let detected = false;

            debugText  = `Stage: ${stage} (${stageIndex+1}/${STAGES.length})\n`;
            debugText += `Side: ${side}\n`;

            switch(stage){
                case "Mountain":
                    detected = detectMountain(sh, hip, wr, ank);
                    debugText += `Upright: ${Math.abs(sh.y-hip.y)<180}\n`;
                    debugText += `Wrist in zone: ${wr.y > sh.y - 40 && wr.y < hip.y + 40}\n`;
                    debugText += `Standing: ${ank.y>hip.y-30}\n`;
                    debugText += `Mountain: ${detected}`;
                    break;
                case "Upward Salute":
                    detected = detectUpwardSalute(sh, wr);
                    debugText += `Arms raised: ${wr.y<sh.y}\n`;
                    debugText += `Upward Salute: ${detected}`;
                    break;
                case "Forward Fold":
                    detected = detectForwardFold(sh, hip, wr, kn, ank, oAnk);
                    const torsoV = {x: sh.x-hip.x, y: sh.y-hip.y};
                    const legV   = {x: kn.x-hip.x, y: kn.y-hip.y};
                    const ffDot  = torsoV.x*legV.x + torsoV.y*legV.y;
                    const ffAng  = Math.acos(Math.max(-1,Math.min(1, ffDot/(Math.hypot(torsoV.x,torsoV.y)*Math.hypot(legV.x,legV.y))))) * 180/Math.PI;
                    debugText += `Torso-leg angle: ${ffAng.toFixed(1)}° (< 100°?): ${ffAng < 100}\n`;
                    debugText += `Ankle-Wrist X diff (near): ${Math.abs(ank.x-wr.x).toFixed(0)}px (< 80?): ${Math.abs(ank.x-wr.x) < 80}\n`;
                    debugText += `Ankle-Wrist X diff (far):  ${Math.abs(oAnk.x-wr.x).toFixed(0)}px (< 80?): ${Math.abs(oAnk.x-wr.x) < 80}\n`;
                    debugText += `Forward Fold: ${detected}`;
                    break;
                case "Lunge Left":
                case "Lunge Right":
                    detected = detectLunge(knAng, hip, kn, ank, sh, oAnk);
                    debugText += `Shoulder-Hip: ${Math.abs(sh.y-hip.y).toFixed(0)}px (<200?)\n`;
                    debugText += `Back leg angle: ${knAng.toFixed(1)}°\n`;
                    debugText += `Ankle X diff: ${Math.abs(ank.x-oAnk.x).toFixed(0)}px (>80?): ${Math.abs(ank.x-oAnk.x)>80}\n`;
                    debugText += `Lunge: ${detected}`;
                    break;
                case "Plank":
                    detected = detectPlank(sh, hip, kn, ank, oKn, oAnk, knAng, oppAng);
                    debugText += `Back level: ${Math.abs(sh.y-hip.y)<100}\n`;
                    debugText += `Body straight: ${Math.abs(hip.y-kn.y)<100}\n`;
                    debugText += `Leg angles: ${knAng.toFixed(0)}°, ${oppAng.toFixed(0)}°\n`;
                    debugText += `Plank: ${detected}`;
                    break;
                case "Low Plank":
                    detected = detectLowPlank(sh, hip, kn, wr);
                    debugText += `Waist-Wrist diff: ${Math.abs(hip.y-wr.y).toFixed(0)}px (< 60?): ${Math.abs(hip.y-wr.y)<60}\n`;
                    debugText += `Knee-Wrist diff: ${Math.abs(kn.y-wr.y).toFixed(0)}px (< 80?): ${Math.abs(kn.y-wr.y)<80}\n`;
                    debugText += `Low Plank: ${detected}`;
                    break;
                case "Cobra":
                    detected = detectCobra(sh, hip, kn, wr);
                    debugText += `Shoulder-Hip diff: ${(hip.y-sh.y).toFixed(0)}px\n`;
                    debugText += `Chest up (>40px): ${sh.y<hip.y-40}\n`;
                    debugText += `Cobra: ${detected}`;
                    break;
                case "Downward Dog":
                    detected = detectDownwardDog(sh, hip, kn, ank, wr);
                    debugText += `Hip-Shoulder: ${(sh.y-hip.y).toFixed(0)}px\n`;
                    debugText += `Wrists below hips: ${wr.y>hip.y}\n`;
                    debugText += `Ankles below hips: ${ank.y>hip.y}\n`;
                    debugText += `Downward Dog: ${detected}`;
                    break;
            }

            // Update locked center gradually as person moves through poses
            const currentCenter = getBodyCenter(keypoints);
            if(currentCenter) lockedCenter = currentCenter;

            document.getElementById('holdIndicator').classList.add('hidden');

            if(detected){
                stageIndex++;
                if(stageIndex >= STAGES.length){ counter++; stageIndex = 0; }
                cooldownUntil = performance.now() + CONFIG.stageCooldownMs;
                updateUI();
            } else {
                // Skip-forward: if current pose not seen but next one is, advance two stages
                const nextIndex = (stageIndex + 1) % STAGES.length;
                const nextDetected = checkPoseByName(STAGES[nextIndex], keypoints, knAng, oppAng, sh, el, hip, kn, ank, wr, oHip, oKn, oAnk);
                if(nextDetected){
                    debugText += `\n⏭ Skipped to next pose`;
                    stageIndex += 2;
                    if(stageIndex >= STAGES.length){ counter++; stageIndex = stageIndex % STAGES.length; }
                    cooldownUntil = performance.now() + CONFIG.stageCooldownMs;
                    updateUI();
                }
            }
        }

        function updateStatus(text, type){
            const bar = document.getElementById('statusBar');
            bar.textContent = text;
            bar.className = 'status-bar status-' + type;
        }

        function updateUI(){
            const controls = document.getElementById('controls');
            const stats    = document.getElementById('stats');
            controls.innerHTML = '';

            if(sessionActive){
                updateStatus('SESSION ACTIVE', 'active');
                controls.innerHTML = `
                    <button class="btn-reset"  onclick="reset()">🔄 Reset</button>
                    <button class="btn-relock" onclick="relockPerson()">📍 Re-lock Person</button>
                    <button class="btn-end"    onclick="endSession()">⏹️ End Session</button>
                `;
                stats.classList.remove('hidden');
                stats.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Reps</div>
                        <div class="stat-value">${counter}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Current Stage</div>
                        <div class="stat-value" style="font-size:1.8rem;">${STAGES[stageIndex]}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Progress</div>
                        <div class="stat-value">${stageIndex+1}/${STAGES.length}</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${(stageIndex/STAGES.length)*100}%"></div>
                        </div>
                    </div>
                `;
            } else {
                updateStatus('STAND IN MOUNTAIN POSE TO START', 'waiting');
                stats.classList.add('hidden');
            }
        }

        function reset(){
            stageIndex = 0; cooldownUntil = 0;
            updateUI();
        }

        function endSession(){
            sessionActive = false; stageIndex = 0; cooldownUntil = 0;
            lockedCenter = null;
            updateUI();
        }

        function relockPerson(){
            // Find the latest smoothed keypoints from history and re-lock center
            if(landmarkHistory.length > 0){
                const smoothed = smoothLandmarks(landmarkHistory);
                const center   = getBodyCenter(smoothed);
                if(center){
                    lockedCenter = center;
                    updateStatus('RE-LOCKED TO CURRENT POSITION', 'active');
                    setTimeout(() => updateStatus('SESSION ACTIVE', 'active'), 1500);
                }
            }
        }

        init();
    </script>
</body>
</html>
